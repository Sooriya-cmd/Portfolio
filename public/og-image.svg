<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A6FF8"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)"/>
  
  <!-- Clouds -->
  <g fill="#FFFFFF" fill-opacity="0.9">
    <ellipse cx="200" cy="520" rx="160" ry="60"/>
    <ellipse cx="1000" cy="540" rx="200" ry="70"/>
  </g>
  
  <!-- Utility pole silhouette on right -->
  <rect x="920" y="80" width="30" height="550" rx="8" fill="#4C1D95"/>
  <rect x="760" y="200" width="220" height="12" rx="4" fill="#3B0764"/>
  <ellipse cx="800" cy="180" rx="20" ry="16" fill="#FFFFFF"/>
  <ellipse cx="850" cy="180" rx="18" ry="14" fill="#FFFFFF"/>
  <ellipse cx="900" cy="180" rx="22" ry="17" fill="#FFFFFF"/>
  
  <!-- Typography Card -->
  <g transform="translate(120, 180)">
    <rect x="0" y="0" width="620" height="260" rx="28" fill="#FFFDF8" stroke="#11111E" stroke-width="8"/>
    <text x="50" y="80" font-family="'Barlow Condensed', sans-serif" font-size="64" font-weight="900" fill="#11111E">SKY STREET</text>
    <text x="50" y="130" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#4F46E5">3D INTERACTIVE PORTFOLIO</text>
    <text x="50" y="180" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#4B5563">Explore a playful scroll-driven world of work and creative code.</text>
  </g>
</svg>
