<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1020"/>
      <stop offset="50%" stop-color="#181534"/>
      <stop offset="100%" stop-color="#26123D"/>
    </linearGradient>
    <radialGradient id="shield-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#mb-bg)"/>

  <!-- Matrix / Grid Pattern -->
  <g stroke="#2EE5EF" stroke-width="1" stroke-opacity="0.15">
    <line x1="50" y1="80" x2="750" y2="80"/>
    <line x1="50" y1="160" x2="750" y2="160"/>
    <line x1="50" y1="240" x2="750" y2="240"/>
    <line x1="50" y1="320" x2="750" y2="320"/>
    <line x1="50" y1="400" x2="750" y2="400"/>
    <line x1="160" y1="50" x2="160" y2="450"/>
    <line x1="320" y1="50" x2="320" y2="450"/>
    <line x1="480" y1="50" x2="480" y2="450"/>
    <line x1="640" y1="50" x2="640" y2="450"/>
  </g>

  <!-- Glowing Glow behind shield -->
  <circle cx="400" cy="235" r="160" fill="url(#shield-glow)"/>

  <!-- Security Shield Graphic with Circuit Nodes -->
  <g transform="translate(400, 230)">
    <!-- Shield Outline -->
    <path d="M 0,-110 L 95,-70 L 95,20 C 95,90 0,140 0,140 C 0,140 -95,90 -95,20 L -95,-70 Z" 
          fill="#16182E" stroke="#FF4F92" stroke-width="4" stroke-linejoin="round"/>
    
    <path d="M 0,-95 L 80,-60 L 80,15 C 80,75 0,120 0,120 C 0,120 -80,75 -80,15 L -80,-60 Z" 
          fill="none" stroke="#2EE5EF" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Brain / Memory Core Nodes -->
    <circle cx="0" cy="-20" r="28" fill="#FF3366" fill-opacity="0.2" stroke="#FF3366" stroke-width="3"/>
    <circle cx="0" cy="-20" r="14" fill="#FFD21F"/>

    <!-- Neural connection lines -->
    <line x1="-50" y1="-40" x2="-14" y2="-25" stroke="#2EE5EF" stroke-width="2.5"/>
    <line x1="50" y1="-40" x2="14" y2="-25" stroke="#2EE5EF" stroke-width="2.5"/>
    <line x1="-40" y1="35" x2="-12" y2="-6" stroke="#2EE5EF" stroke-width="2.5"/>
    <line x1="40" y1="35" x2="12" y2="-6" stroke="#2EE5EF" stroke-width="2.5"/>

    <circle cx="-50" cy="-40" r="8" fill="#2EE5EF"/>
    <circle cx="50" cy="-40" r="8" fill="#2EE5EF"/>
    <circle cx="-40" cy="35" r="8" fill="#FF4F92"/>
    <circle cx="40" cy="35" r="8" fill="#FF4F92"/>

    <!-- Terminal Prompt Accent -->
    <rect x="-65" y="65" width="130" height="26" rx="6" fill="#101120" stroke="#2EE5EF" stroke-width="1.5"/>
    <text x="-50" y="82" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#2EE5EF">> pytest -v</text>
  </g>

  <!-- Badges -->
  <rect x="40" y="40" width="190" height="36" rx="18" fill="#FF3366"/>
  <text x="135" y="63" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PROJECT 01</text>
  
  <text x="760" y="460" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#2EE5EF" text-anchor="end" letter-spacing="1">MEMORYBREAKER</text>
</svg>
