<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#141724"/>
  
  <!-- Color Swatch Cards -->
  <g transform="translate(100, 160)">
    <!-- Swatch 1 -->
    <rect x="0" y="0" width="130" height="180" rx="12" fill="#3A86FF"/>
    <rect x="0" y="120" width="130" height="60" rx="12" fill="#FFFFFF"/>
    <text x="15" y="145" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#141724">AZURE</text>
    <text x="15" y="165" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6C757D">#3A86FF</text>
    
    <!-- Swatch 2 -->
    <rect x="150" y="0" width="130" height="180" rx="12" fill="#8338EC"/>
    <rect x="150" y="120" width="130" height="60" rx="12" fill="#FFFFFF"/>
    <text x="165" y="145" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#141724">VIOLET</text>
    <text x="165" y="165" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6C757D">#8338EC</text>
    
    <!-- Swatch 3 -->
    <rect x="300" y="0" width="130" height="180" rx="12" fill="#FF006E"/>
    <rect x="300" y="120" width="130" height="60" rx="12" fill="#FFFFFF"/>
    <text x="315" y="145" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#141724">MAGENTA</text>
    <text x="315" y="165" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6C757D">#FF006E</text>
    
    <!-- Swatch 4 -->
    <rect x="450" y="0" width="130" height="180" rx="12" fill="#FB5607"/>
    <rect x="450" y="120" width="130" height="60" rx="12" fill="#FFFFFF"/>
    <text x="465" y="145" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#141724">CORAL</text>
    <text x="465" y="165" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#6C757D">#FB5607</text>
  </g>
  
  <rect x="40" y="40" width="160" height="34" rx="17" fill="#8338EC"/>
  <text x="120" y="62" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PROJECT 05</text>
  <text x="760" y="460" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FF006E" text-anchor="end">CHROMA ENGINE</text>
</svg>
