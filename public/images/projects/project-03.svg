<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121E"/>
      <stop offset="60%" stop-color="#141E34"/>
      <stop offset="100%" stop-color="#1B2E4B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ch-bg)"/>

  <!-- Dashboard Frame UI -->
  <g transform="translate(140, 100)">
    <!-- Main Window Card -->
    <rect x="0" y="0" width="520" height="310" rx="16" fill="#18233C" stroke="#2EE5EF" stroke-width="3"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="520" height="42" rx="16" fill="#101728"/>
    <circle cx="24" cy="21" r="6" fill="#FF4F92"/>
    <circle cx="44" cy="21" r="6" fill="#FFD21F"/>
    <circle cx="64" cy="21" r="6" fill="#28E070"/>
    <text x="260" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#8E9CB8" text-anchor="middle">ClubHub • Management Portal</text>

    <!-- Sidebar Mini -->
    <rect x="16" y="58" width="120" height="236" rx="10" fill="#121A2D"/>
    <rect x="28" y="76" width="96" height="18" rx="6" fill="#3158DF"/>
    <rect x="28" y="106" width="96" height="14" rx="6" fill="#202C45"/>
    <rect x="28" y="130" width="96" height="14" rx="6" fill="#202C45"/>
    <rect x="28" y="154" width="96" height="14" rx="6" fill="#202C45"/>

    <!-- Content Cards Grid -->
    <!-- Card 1: Clubs -->
    <rect x="152" y="58" width="168" height="108" rx="10" fill="#202D49" stroke="#FF4F92" stroke-width="2"/>
    <text x="170" y="86" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FF4F92">ACTIVE CLUBS</text>
    <text x="170" y="128" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">12</text>
    <circle cx="285" cy="112" r="16" fill="#FF4F92" fill-opacity="0.2"/>
    <text x="285" y="117" font-family="'Inter', sans-serif" font-size="14" fill="#FF4F92" text-anchor="middle">👥</text>

    <!-- Card 2: Events -->
    <rect x="336" y="58" width="168" height="108" rx="10" fill="#202D49" stroke="#2EE5EF" stroke-width="2"/>
    <text x="354" y="86" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#2EE5EF">MEETINGS</text>
    <text x="354" y="128" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">28</text>
    <circle cx="469" cy="112" r="16" fill="#2EE5EF" fill-opacity="0.2"/>
    <text x="469" y="117" font-family="'Inter', sans-serif" font-size="14" fill="#2EE5EF" text-anchor="middle">📅</text>

    <!-- Table row placeholder -->
    <rect x="152" y="180" width="352" height="114" rx="10" fill="#121A2D"/>
    <text x="170" y="208" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#8E9CB8">RECENT ANNOUNCEMENTS</text>
    <line x1="170" y1="222" x2="488" y2="222" stroke="#253350" stroke-width="1.5"/>
    <text x="170" y="246" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">• AI Workshop Registrations Open</text>
    <text x="170" y="272" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">• Slingshot Hackathon Team Selection</text>
  </g>

  <!-- Badges -->
  <rect x="40" y="40" width="190" height="36" rx="18" fill="#00C49F"/>
  <text x="135" y="63" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PROJECT 03</text>
  
  <text x="760" y="460" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#2EE5EF" text-anchor="end" letter-spacing="1">CLUBHUB</text>
</svg>
