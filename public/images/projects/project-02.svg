<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B1E"/>
      <stop offset="60%" stop-color="#16123D"/>
      <stop offset="100%" stop-color="#2C0F45"/>
    </linearGradient>
    <radialGradient id="planet-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="80%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#nv-bg)"/>

  <!-- Starfield dots -->
  <g fill="#FFFFFF" fill-opacity="0.4">
    <circle cx="120" cy="90" r="1.5"/>
    <circle cx="280" cy="70" r="2"/>
    <circle cx="680" cy="110" r="1.5"/>
    <circle cx="720" cy="280" r="2.5"/>
    <circle cx="160" cy="380" r="1.5"/>
    <circle cx="640" cy="420" r="2"/>
  </g>

  <!-- 3D Spatial Knowledge Graph / Constellation Nodes -->
  <g transform="translate(400, 240)">
    <!-- Central Procedural Planet -->
    <ellipse cx="0" cy="100" rx="90" ry="18" fill="#000000" fill-opacity="0.4"/>
    <circle cx="0" cy="0" r="85" fill="url(#planet-grad)"/>

    <!-- Orbital Rings -->
    <ellipse cx="0" cy="0" rx="190" ry="60" fill="none" stroke="#2EE5EF" stroke-width="2" stroke-opacity="0.7" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="270" ry="90" fill="none" stroke="#FF4F92" stroke-width="1.5" stroke-dasharray="6,6" transform="rotate(20)"/>

    <!-- Graph Nodes on Orbit -->
    <!-- Node 1 -->
    <circle cx="-140" cy="-45" r="16" fill="#1E1B4B" stroke="#2EE5EF" stroke-width="3"/>
    <text x="-140" y="-40" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#2EE5EF" text-anchor="middle">MD</text>
    <line x1="-140" y1="-45" x2="-60" y2="-15" stroke="#2EE5EF" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Node 2 -->
    <circle cx="150" cy="40" r="18" fill="#1E1B4B" stroke="#FFD21F" stroke-width="3"/>
    <text x="150" y="45" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#FFD21F" text-anchor="middle">3D</text>
    <line x1="150" y1="40" x2="70" y2="15" stroke="#FFD21F" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Node 3 -->
    <circle cx="-190" cy="80" r="14" fill="#1E1B4B" stroke="#FF4F92" stroke-width="2.5"/>
    <line x1="-190" y1="80" x2="-140" y2="-45" stroke="#FF4F92" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Node 4 -->
    <circle cx="210" cy="-60" r="14" fill="#1E1B4B" stroke="#2EE5EF" stroke-width="2.5"/>
    <line x1="210" y1="-60" x2="150" y2="40" stroke="#2EE5EF" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Badges -->
  <rect x="40" y="40" width="190" height="36" rx="18" fill="#6366F1"/>
  <text x="135" y="63" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PROJECT 02</text>
  
  <text x="760" y="460" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#A5B4FC" text-anchor="end" letter-spacing="1">NOVA-NOTES</text>
</svg>
